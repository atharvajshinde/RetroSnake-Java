<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Retro Snake</title>
    <!-- Upgrade to CheerpJ 4.3 -->
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
      body { margin: 0; background-color: #9bbc0f; overflow: hidden; height: 100vh; }
    </style>
  </head>
  <body>
    <script>
      async function runGame() {
        // Initialize the JVM and explicitly request Java 17
        await cheerpjInit({ version: 17 });
        
        cheerpjCreateDisplay(-1, -1, document.body);
        
        // Mount the JAR from the virtual /app/ directory
        await cheerpjRunJar("/app/libs/Snake.jar");
      }
      
      runGame();
    </script>
  </body>
</html>
